<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="110" fill="url(#gvGrad)" />
  <!-- Glass Reflection Overlay -->
  <rect width="512" height="256" rx="110" fill="#FFFFFF" fill-opacity="0.1" />
  <!-- GV Bold Logo Typography -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="230" letter-spacing="-6" filter="url(#shadow)">GV</text>
</svg>
